<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Ledge</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="tooltip" id="tooltip"></div>
      <div class="notch pill" id="notch">
        <svg class="notch-shape" viewBox="0 0 70 400" preserveAspectRatio="none" aria-hidden="true">
          <path id="notchPath" />
        </svg>
        <div class="cells" id="cells"></div>
      </div>
    </div>
    <script src="glyphs.js"></script>
    <script src="app.js"></script>
  </body>
</html>
