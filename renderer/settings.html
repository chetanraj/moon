<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Rim</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif;
      }
      body {
        margin: 0;
        padding: 20px 22px 28px;
        font-size: 13px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 16px;
      }
      h2 {
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: #888;
        margin: 18px 0 8px;
      }
      label.row {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
      }
      .edges {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .edges button {
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #4444;
        background: transparent;
        color: inherit;
        cursor: pointer;
      }
      .edges button.on {
        background: #111;
        color: #fff;
      }
      @media (prefers-color-scheme: light) {
        .edges button.on {
          background: #111;
          color: #fff;
        }
      }
    </style>
  </head>
  <body>
    <h1>Rim</h1>
    <p style="margin:-8px 0 16px;color:#888">Your AI usage</p>
    <h2>Edge</h2>
    <div class="edges" id="edges">
      <button data-edge="left">Left</button>
      <button data-edge="right">Right</button>
      <button data-edge="top">Top</button>
      <button data-edge="bottom">Bottom</button>
    </div>
    <h2>Behavior</h2>
    <label class="row"><input type="checkbox" id="collapsed" /> Collapse to a pill until hovered</label>
    <label class="row"><input type="checkbox" id="hideOnFullscreen" /> Hide on fullscreen</label>
    <h2>Providers</h2>
    <div id="providers"></div>
    <script src="settings.js"></script>
  </body>
</html>
